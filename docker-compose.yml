services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: product_aggregator_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            timeout: 5s
            retries: 5
    translator:
        build:
            context: .
            dockerfile: Dockerfile.translator
        container_name: product_aggregator_translator
        ports:
            - "8000:8000"
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: product_aggregator_web
        command: node cmd/start_api.js
        env_file: .env
        environment:
            NODE_ENV: production
            PORT: 3000
            DB_HOST: postgres
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s

    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: product_aggregator_bot
        command: node cmd/start_bot.js
        env_file: .env
        environment:
            NODE_ENV: production
            DB_HOST: postgres
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'start_bot.js' > /dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    cron:
        build:
            context: .
            dockerfile: Dockerfile.cron
        container_name: product_aggregator_cron
        command: node cmd/cron.js
        env_file: .env
        environment:
            NODE_ENV: production
            DB_HOST: postgres
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'cmd/cron.js' > /dev/null || exit 1"]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    postgres_data:
