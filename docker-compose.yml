services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: product_aggregator_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            timeout: 5s
            retries: 5
    translator:
        build:
            context: .
            dockerfile: Dockerfile.translator
        container_name: product_aggregator_translator
        ports:
            - "8000:8000"
        restart: unless-stopped

volumes:
    postgres_data:
